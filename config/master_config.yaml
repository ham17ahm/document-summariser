# ==============================================================================
#  DOCUMENT SUMMARISER - MASTER CONFIGURATION
# ==============================================================================
#
#  This file is read from top to bottom in the order you are likely to need it:
#
#    STEP 1  pipeline    Which model does which job.        <-- change this most
#    STEP 2  providers   The list of models you can pick from (add/remove here).
#    STEP 3  vendors     One block per AI company (API key name, web address).
#    STEP 4  everything else (language, OCR, prompts, output, retries).
#
#  QUICK RECIPES
#
#  * Use a different model for a job
#      Change the name in STEP 1 to any name listed in STEP 2.
#
#  * Upgrade a model to a newer version
#      In STEP 2, change the "model:" line of that entry.
#
#  * Add a brand-new model
#      Copy the template at the top of STEP 2, give it a name, then use that
#      name in STEP 1.
#
#  * Remove a model
#      Delete its entry in STEP 2. Make sure STEP 1 no longer uses its name
#      (the app tells you at startup if it does).
#
#  RULES OF THE FILE
#
#  * Indentation matters. Use spaces (never tabs) and keep things lined up.
#  * Lines starting with "#" are notes and are ignored by the app.
#  * API keys are NOT stored here. They live in the ".env" file; this file
#    only holds the NAME of the variable that contains each key.
#  * Mistakes are caught at startup, before any money is spent on OCR.
#
# ==============================================================================

# ==============================================================================
#  STEP 1 - PIPELINE: which model does which job
# ==============================================================================
#  Every name used here must be an entry in STEP 2 (providers).
#  Models listed in STEP 2 but not named here are never called and cost nothing.
pipeline:
  # Job 1: clean up the raw OCR text. Use a Google Gemini model here: only
  # Gemini also receives the page images to check the text against. Other
  # vendors still work, but correct from the text alone.
  correction_provider: gemini

  # Job 2: independent summaries, one per model, all run at the same time.
  # Keep exactly four names: the consolidation prompts have four summary slots.
  summarisers: [chatgpt_gpt6, claude, grok, deepseek]

  # Job 3: merge the four summaries into the final text.
  # Alternative: gemini_carbon_medium (deeper reasoning, slower, more thinking).
  # For a single run, override this with -m (see model_aliases below).
  consolidator: gemini_argon_medium

  # How many of the summaries must succeed for the run to continue.
  # 4 = all must succeed. Lower it (e.g. 3) to keep going when one service
  # is temporarily down. Cannot be higher than the number of summarisers.
  min_summaries: 4

# Short names for choosing the Job 3 (consolidation) model on the command line,
# without editing this file:
#
#     summarise letter.pdf -m carbon
#     summarise letter.pdf -p report -m argon
#
# Left side: the short name you type. Right side: an entry from STEP 2.
# Add, rename or remove lines freely. Without -m, "consolidator" above is used.
# A full STEP 2 name also works: -m gemini_argon_high
model_aliases:
  argon: gemini_argon_medium
  argonhigh: gemini_argon_high
  carbon: gemini_carbon_medium

# ==============================================================================
#  STEP 2 - PROVIDERS: the models you can choose from
# ==============================================================================
#  Each entry is one "model + settings" combination with a name of your choice.
#  That name is what you type in STEP 1.
#
#  ---- TEMPLATE: copy, paste below, remove the "# " and fill in ----------------
#
#  my_new_model:                 # any unique name (letters, digits, underscore)
#    vendor: openai              # one of the vendors in STEP 3:
#                                #   google | openai | anthropic | xai | deepseek
#    model: exact-model-id       # the model ID from the vendor's documentation
#    max_output_tokens: 32768    # upper limit on the length of the answer
#
#  ------------------------------------------------------------------------------
#
#  Settings every entry can have:
#    vendor             (required) which company's API to use - see STEP 3
#    model              (required) the vendor's exact model ID
#    max_output_tokens  maximum answer length. For "thinking"/"reasoning" models
#                       this budget also covers the thinking, so keep it
#                       generous - too low a value cuts the answer off.
#    temperature        optional; leave it out for reasoning models
#
#  Extra settings that only some vendors understand:
#    google     thinking_config:  thinking_level: low|medium|high  (Gemini 4)
#                                 thinking_budget: <tokens>        (older Gemini)
#    openai     reasoning_effort: low|medium|high
#    anthropic  thinking: / output_config:  (see the "claude" entry)
#    openai, xai, anthropic       prompt_cache:  enabled: true
#
#  You may keep several entries for the same model with different settings
#  (see gemini_argon_medium / gemini_argon_high below).
#
#  The "other model IDs" notes below were last checked in July 2026; check the
#  vendor's documentation for the current list.
providers:
  # ---- Google Gemini ---------------------------------------------------------

  # Fast Gemini model.
  gemini:
    vendor: google
    model: gemini-2.5-flash
    # Other model IDs you can put on the line above:
    #   gemini-3.5-flash       latest GA Flash; strongest fast model
    #   gemini-3-flash         previous Gen-3 Flash, still available
    #   gemini-3.1-flash-lite  cheapest, high-volume option
    max_output_tokens: 16384
    # Keep both values: without them Gemini used up its whole output budget
    # on thinking and returned a cut-off answer.
    thinking_config:
      thinking_budget: 1024

  # Gemini 3.1 Pro (the previous consolidator).
  gemini_consolidate:
    vendor: google
    model: gemini-3.1-pro-preview
    # Faster / cheaper alternative:
    #   gemini-3.5-flash
    max_output_tokens: 16384
    thinking_config:
      thinking_budget: 1024

  # Gemini 4 Argon, medium thinking.
  gemini_argon_medium:
    vendor: google
    model: gemini-4-argon
    max_output_tokens: 32768
    thinking_config:
      thinking_level: medium

  # Gemini 4 Argon, high thinking: slower and costlier, more thorough.
  gemini_argon_high:
    vendor: google
    model: gemini-4-argon
    # Includes thinking tokens; requires google-genai>=2.30.1 for continuation.
    max_output_tokens: 65536
    thinking_config:
      thinking_level: high

  # Gemini 4 Carbon, medium thinking: deeper reasoning than Argon at the same
  # per-token price, but it spends more thinking tokens and answers more slowly.
  # Price per 1M tokens (same as Argon): $2 in / $10 out until 30 Nov 2026,
  # then $4 in / $20 out. Thinking is billed as output.
  gemini_carbon_medium:
    vendor: google
    model: gemini-4-carbon
    # Includes thinking tokens. One response can hold at most 65536.
    max_output_tokens: 32768
    thinking_config:
      thinking_level: medium

  # ---- OpenAI (ChatGPT) ------------------------------------------------------

  # GPT-6.
  chatgpt_gpt6:
    vendor: openai
    model: gpt-6-astra
    max_output_tokens: 32768
    reasoning_effort: medium
    # Do not set temperature for this reasoning model.
    prompt_cache:
      enabled: true

  # GPT-5.2 (the previous ChatGPT summariser).
  chatgpt:
    vendor: openai
    model: gpt-5.2
    # Other model IDs you can put on the line above (all support up to 128k
    # output tokens if you want to raise max_output_tokens):
    #   gpt-5.6-sol    flagship: complex reasoning & coding ("gpt-5.6" also works)
    #   gpt-5.6-terra  balanced intelligence vs cost
    #   gpt-5.6-luna   fastest / cheapest, high-volume work
    max_output_tokens: 4096
    prompt_cache:
      enabled: true

  # ---- Anthropic (Claude) ----------------------------------------------------

  claude:
    vendor: anthropic
    model: claude-opus-5-5
    max_output_tokens: 64000
    prompt_cache:
      enabled: true
      ttl: 5m
    thinking:
      type: adaptive
      display: omitted
    output_config:
      effort: medium

  # ---- xAI (Grok) ------------------------------------------------------------

  grok:
    vendor: xai
    model: grok-4.3
    # Other model IDs you can put on the line above:
    #   grok-4.5  newer flagship, 500k context. Cheaper "fast" variants also
    #             exist - see https://docs.x.ai/developers/models for current IDs.
    max_output_tokens: 4096
    prompt_cache:
      enabled: true

  # ---- DeepSeek --------------------------------------------------------------

  deepseek:
    vendor: deepseek
    model: deepseek-v4-pro
    # Faster / cheaper alternative from the same family:
    #   deepseek-v4-flash
    # Do NOT use the legacy "deepseek-chat" / "deepseek-reasoner" names; they
    # were scheduled for retirement on 24 Jul 2026.
    # Shared budget for reasoning and the final summary; 4096 caused truncation.
    max_output_tokens: 32768

# ==============================================================================
#  STEP 3 - VENDORS: one block per AI company (rarely changes)
# ==============================================================================
#  Everything written here is shared by all of that vendor's models in STEP 2,
#  so you never have to repeat it. A model entry may still override a value by
#  writing the same setting itself.
#
#    type         which built-in connector the app uses. Supported values:
#                 gemini | openai | anthropic | grok | deepseek
#    api_key_env  NAME of the variable in ".env" that holds the API key
#    base_url     web address of the API (only where the connector needs it)
vendors:
  google:
    type: gemini
    api_key_env: GEMINI_API_KEY
  openai:
    type: openai
    api_key_env: OPENAI_API_KEY
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
  xai:
    type: grok
    api_key_env: XAI_API_KEY
    base_url: https://api.x.ai/v1
  deepseek:
    type: deepseek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com

# ==============================================================================
#  STEP 4 - EVERYTHING ELSE (usually left alone)
# ==============================================================================

# Language of the final summary ("ur" = Urdu).
language:
  summary_language: ur

# Reading text out of the PDF pages.
ocr:
  provider: google_cloud_vision
  language_hints: [ur, en]
  # Higher = sharper page images (better OCR) but larger files.
  page_image_dpi: 300
  # Pages read with less confidence than this are flagged as low confidence.
  low_confidence_threshold: 0.8

# Instruction files given to the models. Edit the text inside those files,
# not here.
prompts:
  correction: prompts/correction.prompt.txt
  summarise: prompts/summarise.prompt.txt
  consolidate: prompts/consolidate.prompt.txt

# Folder holding the selectable prompt sets (summarise input.pdf -p <name>).
prompt_sets:
  directory: prompts/sets

# Where results are written.
output:
  format: txt
  # Folder for the final summary text file.
  final_text_directory: 'C:\Users\Hamad.Mobeen\Downloads'
  # Folder for each run's working files (OCR text, individual summaries, ...).
  destination: ./runs/

# Speed and reliability.
runtime:
  # How many summaries are requested at the same time.
  concurrency: 4
  # How long to wait for one answer before giving up. Raise this if
  # high-thinking models time out.
  request_timeout_seconds: 300
  # Attempts per request when a service is busy or briefly down (minimum 1).
  retries: 3
  # Wait before the first retry; it doubles after each further failure.
  retry_initial_delay_seconds: 1
