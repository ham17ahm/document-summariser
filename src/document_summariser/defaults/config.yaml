language:
  summary_language: ur

ocr:
  provider: google_cloud_vision
  language_hints: [ur, en]
  page_image_dpi: 300
  low_confidence_threshold: 0.8

pipeline:
  correction_provider: gemini
  summarisers: [chatgpt, claude, grok, deepseek]
  consolidator: gemini
  min_summaries: 4

# Each provider names a vendor and inherits its type, api_key_env and base_url
# from the vendors block below. See config/master_config.yaml for a commented guide.
providers:
  gemini_argon_medium:
    vendor: google
    model: gemini-4-argon
    max_output_tokens: 32768
    thinking_config:
      thinking_level: medium
  gemini_argon_high:
    vendor: google
    model: gemini-4-argon
    max_output_tokens: 65536
    thinking_config:
      thinking_level: high
  chatgpt_gpt6:
    vendor: openai
    model: gpt-6-astra
    max_output_tokens: 32768
    reasoning_effort: medium
    prompt_cache:
      enabled: true
  chatgpt:
    vendor: openai
    model: gpt-5.2
    max_output_tokens: 4096
    prompt_cache:
      enabled: true
  gemini:
    vendor: google
    model: gemini-3.1-pro-preview
    max_output_tokens: 16384
    thinking_config:
      thinking_budget: 1024
  grok:
    vendor: xai
    model: grok-4.3
    max_output_tokens: 4096
    prompt_cache:
      enabled: true
  deepseek:
    vendor: deepseek
    model: deepseek-v4-pro
    # Shared budget for reasoning and the final summary; 4096 caused truncation.
    max_output_tokens: 32768
  claude:
    vendor: anthropic
    model: claude-opus-4-8
    max_output_tokens: 64000
    prompt_cache:
      enabled: true
      ttl: 5m
    thinking:
      type: adaptive
      display: omitted
    output_config:
      effort: xhigh

vendors:
  google:
    type: gemini
    api_key_env: GEMINI_API_KEY
  openai:
    type: openai
    api_key_env: OPENAI_API_KEY
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
  xai:
    type: grok
    api_key_env: XAI_API_KEY
    base_url: https://api.x.ai/v1
  deepseek:
    type: deepseek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com

prompts:
  correction: prompts/correction.prompt.txt
  summarise: prompts/summarise.prompt.txt
  consolidate: prompts/consolidate.prompt.txt

prompt_sets:
  directory: prompts/sets

output:
  format: txt
  final_text_directory: 'C:\Users\Hamad.Mobeen\Downloads'
  destination: ./runs/

runtime:
  concurrency: 4
  request_timeout_seconds: 120
  retries: 3
  retry_initial_delay_seconds: 1
